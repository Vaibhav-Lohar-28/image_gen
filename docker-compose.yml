services:
  comfyui-worker:
    # Build it first:
    #   docker build --target final --platform linux/amd64 \
    #     [--build-arg HUGGINGFACE_ACCESS_TOKEN=<your-token>] \
    #     -t runpod-worker-comfy:krea2-identity .
    image: runpod-worker-comfy:krea2-identity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - SERVE_API_LOCALLY=true
    ports:
      - "8000:8000"
      - "8188:8188"
    volumes:
      - ./data/comfyui/output:/comfyui/output
      - ./data/runpod-volume:/runpod-volume
